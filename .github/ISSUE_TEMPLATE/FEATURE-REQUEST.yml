name: "💡 Feature Request"
description: Create a new ticket for a new feature request
title: "💡 [FEATURE] "
labels: [
  "feature"
]
body:
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: Provide a summary of your feature request.
      placeholder: A few specific words about your feature request.
    validations:
      required: false
  - type: textarea
    id: user_story
    attributes:
      label: "User Story"
      description: Provide the user story for your feature request.
      placeholder: As a [persona]... I want to... So that...
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria"
      description: Provide the acceptance criteria for your feature request.
      placeholder: Given [context]... When [event]... Then [outcome]...
    validations:  
      required: false
