name: "👩🏻‍💻 Tech Issue"
description: Create a new ticket for a new tech issue
title: "👩🏻‍💻 [TECH] "
labels: [
  "tech"
]
body:
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: Provide a brief explanation of the tech issue
      placeholder: Describe in a few lines your tech issue
    validations:
      required: true
  - type: textarea
    id: basic_example
    attributes:
      label: "Basic Example / References"
      description: Indicate here some basic examples and/or references of your tech issue.
    validations:
      required: false
  - type: textarea
    id: unresolved_question
    attributes:
      label: "Unresolved questions"
      description: What questions still remain unresolved?
      placeholder: Identify any unresolved issues.
    validations:
      required: false